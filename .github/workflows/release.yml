name: Release

# Publishes a GitHub release whenever module.json's version changes on main.
on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        run: zip -r module.zip module.json README.md scripts styles
      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" module.json module.zip \
            --title "v${{ steps.v.outputs.version }}" \
            --notes "Install or update via manifest URL: https://github.com/${{ github.repository }}/releases/latest/download/module.json"
